<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graham Service Manager</title><style> *{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#eef2f6;color:#173047}header{background:#102c48;color:white;padding:22px}h1{margin:0;letter-spacing:2px}nav{display:flex;flex-wrap:wrap;background:white;padding:8px;gap:6px}button{background:#17629b;color:white;border:0;border-radius:6px;padding:10px;cursor:pointer;font:inherit}button:disabled{opacity:.5}main{padding:18px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.panel{background:white;border:1px solid #d8e1eb;border-radius:9px;padding:16px;margin-bottom:12px}input,select,textarea{width:100%;padding:10px;border:1px solid #bac8d5;border-radius:5px;font:inherit;margin:5px 0 12px}label{display:block}small{color:#60758a}.job{border-left:4px solid #297cb8;background:#edf5fc;padding:10px;margin:8px 0;border-radius:4px}h2,h3{margin-top:0}.metric{font-size:30px;font-weight:bold}#msg{padding:0 18px;color:#a12626;white-space:pre-wrap}.secondary{background:#52677b}</style><header><small style="color:#c8d9eb">EST. 1976 • CELEBRATING 50 YEARS</small><h1>GRAHAM</h1>HEATING & AIR CONDITIONING · SERVICE MANAGER</header><nav id="nav"></nav><p id="msg" role="alert"></p><main id="main">Loading…</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=s=>document.querySelector(s), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>Number(n).toLocaleString('en-US',{style:'currency',currency:'USD'}), today=()=>new Date().toLocaleDateString('en-CA');
const api=supabase.createClient('https://yfgfekgmrcwjrcmzyaqn.supabase.co','sb_publishable_VhI-bCVxE8CeayG8AAUNyA_jxQ2mpLh');let user=null,db={},page='Dashboard',date=today(),busy=false;const tabs=['Dashboard','Dispatch','Customers','Estimates','Reminders','Settings'], statuses=['Scheduled','Dispatched','In progress','Waiting on parts','Completed'];
function fail(e){$('#msg').textContent=e.message||String(e)}async function query(q){let r=await q;if(r.error)throw r.error;return r.data}async function load(){let tables=['employees','customers','jobs','estimates','reminders','company_settings'];let data=await Promise.all(tables.map(t=>query(api.from(t).select('*'))));db=Object.fromEntries(tables.map((t,i)=>[t,data[i]]));}function clear(){db={};user=null;$('#nav').innerHTML='';}function login(){clear();$('#main').innerHTML='<div class="panel" style="max-width:420px;margin:auto"><h2>Employee sign in</h2><form><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></div>';bind(async d=>{await query(api.auth.signInWithPassword(d));await start()})}async function start(){try{let s=await query(api.auth.getSession());if(!s.session)return login();user=s.session.user;let owner=await query(api.rpc('is_owner'));if(!owner){await api.auth.signOut();login();throw Error('This account does not have owner access yet.')}await load();render()}catch(e){clear();login();fail(e)}}
function bind(fn){let f=$('#main form');f.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;let b=f.querySelector('button');b.disabled=true;$('#msg').textContent='';try{await fn(Object.fromEntries(new FormData(f)))}catch(e){fail(e)}finally{busy=false;b.disabled=false}}}async function go(p){$('#msg').textContent='';try{await load();page=p;render()}catch(e){fail(e)}}async function logout(){await api.auth.signOut();login()}
const field=(l,n,v='',t='text',req=false)=>`<label>${l}<input name="${n}" type="${t}" value="${E(v)}" ${req?'required':''} ${t==='number'?'min="0" step="0.01"':''}></label>`;const opts=(l,n,a,v)=>`<label>${l}<select name="${n}">${a.map(([k,s])=>`<option value="${E(k)}" ${k===v?'selected':''}>${E(s)}</option>`).join('')}</select></label>`;const techs=()=>db.employees.filter(x=>x.role==='technician'&&x.active);const cust=id=>db.customers.find(c=>c.id===id)?.name||'Unknown customer';const job=j=>`<div class="job"><b>${E(cust(j.customer_id))}</b><p>${E(j.title)} · ${E(j.scheduled_time)}</p><small>${E(j.status)} · ${E(j.service_address)}</small><p><button onclick="editJob('${j.id}')">Open job</button></p></div>`;
function editJob(id){let j=db.jobs.find(x=>x.id===id)||{scheduled_date:date,scheduled_time:'08:00',status:'Scheduled'};$('#main').innerHTML=`<div class="panel"><h2>Service call</h2><form>${opts('Existing customer','customer_id',[['','New customer'],...db.customers.map(c=>[c.id,c.name])],j.customer_id||'')}${field('New customer name (if needed)','name')}${field('New customer phone','phone','','tel')}${field('Service address','service_address',j.service_address)}${field('Work requested','title',j.title,'text',true)}${field('Date','scheduled_date',j.scheduled_date,'date',true)}${field('Time','scheduled_time',j.scheduled_time,'time',true)}${opts('Technician','technician_id',[['','Unassigned'],...techs().map(t=>[t.id,t.full_name])],j.technician_id||'')}${opts('Status','status',statuses.map(s=>[s,s]),j.status)}<label>Notes<textarea name="diagnostic_notes">${E(j.diagnostic_notes)}</textarea></label><button>Save job</button> <button type="button" class="secondary" onclick="go('Dispatch')">Cancel</button></form></div>`;bind(async d=>{let {name,phone,...r}=d;if(!r.customer_id){if(!name.trim())throw Error('Enter a customer name or select an existing customer.');let c=await query(api.from('customers').insert({name,phone,address:r.service_address}).select().single());r.customer_id=c.id}r.technician_id=r.technician_id||null;r.completed_at=r.status==='Completed'?(j.completed_at||new Date().toISOString()):null;await query(id?api.from('jobs').update(r).eq('id',id):api.from('jobs').insert(r));await go('Dispatch')})}
function render(){if(!user)return login();$('#nav').innerHTML=tabs.map(t=>`<button onclick="go('${t}')">${t}</button>`).join('')+'<button class="secondary" onclick="logout()">Sign out</button>';let m=$('#main');if(page==='Dashboard')m.innerHTML=`<h2>Business overview</h2><div class="grid">${[['Open jobs',db.jobs.filter(j=>j.status!=='Completed').length],['Completed',db.jobs.filter(j=>j.status==='Completed').length],['Customers',db.customers.length],['Estimates',money(db.estimates.reduce((a,e)=>a+Number(e.total),0))]].map(([l,v])=>`<div class="panel">${l}<div class="metric">${v}</div></div>`).join('')}</div><button onclick="editJob('')">+ Book service call</button><p>Cloud pilot · Owner access only · Use sample data until security testing is complete.</p>`;
if(page==='Dispatch')m.innerHTML=`<h2>Dispatch board</h2><input type="date" value="${E(date)}" onchange="date=this.value;render()"><button onclick="editJob('')">+ Book job</button><p></p><div class="grid">${[{id:null,full_name:'Unassigned'},...techs()].map(t=>`<div class="panel"><h3>${E(t.full_name)}</h3>${db.jobs.filter(j=>j.technician_id===t.id&&j.scheduled_date===date).sort((a,b)=>a.scheduled_time.localeCompare(b.scheduled_time)).map(job).join('')||'No jobs scheduled'}</div>`).join('')}</div>`;
if(page==='Customers')m.innerHTML=`<h2>Customers</h2>${db.customers.map(c=>`<div class="panel"><b>${E(c.name)}</b><p>${E(c.phone)} · ${E(c.address)}</p>${db.jobs.filter(j=>j.customer_id===c.id).map(job).join('')}</div>`).join('')||'Book a job to add a customer.'}`;
if(page==='Estimates'){let s=db.company_settings[0]||{};m.innerHTML=`<h2>Estimate builder</h2><form class="panel">${opts('Customer','customer_id',[['','Select customer'],...db.customers.map(c=>[c.id,c.name])],'')}${field('Description','description')}${field('Labor hours','labor_hours',1,'number',true)}${field('Hourly rate','labor_rate',s.labor_rate??135,'number',true)}${field('Parts cost','parts_cost',0,'number',true)}${field('Markup %','parts_markup',s.parts_markup??40,'number',true)}${field('Service fee','service_fee',s.service_fee??70,'number',true)}<h3 id="total"></h3><button>Save estimate</button></form>${db.estimates.map(e=>`<div class="panel">${E(cust(e.customer_id))} — ${money(e.total)}</div>`).join('')}`;let f=m.querySelector('form'),calc=d=>Math.round((+d.labor_hours*+d.labor_rate+ +d.parts_cost*(1+ +d.parts_markup/100)+ +d.service_fee)*100)/100;f.oninput=()=>$('#total').textContent=money(calc(Object.fromEntries(new FormData(f))))+' before tax';f.oninput();bind(async d=>{if(!d.customer_id)throw Error('Select a customer');await query(api.from('estimates').insert({...d,total:calc(d)}));await go('Estimates')})}
if(page==='Reminders'){m.innerHTML=`<h2>Reminders</h2><p>Cloud reminders only. Apple Reminders is not connected.</p><form class="panel">${field('Task','title','','text',true)}${field('Due date','due_date','','date')}${opts('List','assigned_to',[['','Shared office'],...techs().map(t=>[t.id,t.full_name])],'')}<button>Add reminder</button></form>${db.reminders.map(t=>`<div class="panel"><input style="width:auto" type="checkbox" ${t.completed?'checked':''} onchange="toggleTask('${t.id}',this.checked)"> ${E(t.title)} · ${E(t.due_date?.slice(0,10))}</div>`).join('')}`;bind(async d=>{await query(api.from('reminders').insert({...d,due_date:d.due_date?new Date(d.due_date+'T12:00:00').toISOString():null,assigned_to:d.assigned_to||null,shared:!d.assigned_to,created_by:user.id}));await go('Reminders')})}
if(page==='Settings')m.innerHTML=`<h2>Settings</h2><div class="panel">Signed in: ${E(user.email)}<p>Owner access</p><p>Technicians configured: ${techs().length} / 4</p><p>QuickBooks, PayAnywhere and Apple Reminders: not connected.</p></div>`;}
async function toggleTask(id,completed){try{await query(api.from('reminders').update({completed}).eq('id',id));await go('Reminders')}catch(e){fail(e);render()}}start();
</script></html>
