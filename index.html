<!doctype html><html><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Graham Service Manager</title><style> *{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#eef2f6;color:#173047}header{background:#102c48;color:white;padding:22px}h1{margin:0;letter-spacing:2px}nav{display:flex;flex-wrap:wrap;background:white;padding:8px;gap:6px}button{background:#17629b;color:white;border:0;border-radius:6px;padding:10px;cursor:pointer;font:inherit}main{padding:18px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.panel{background:white;border:1px solid #d8e1eb;border-radius:9px;padding:14px;margin-bottom:12px}input,select,textarea{width:100%;padding:10px;border:1px solid #bac8d5;border-radius:5px;font:inherit;margin:5px 0 12px}label{display:block}small{color:#60758a}.job{border-left:4px solid #297cb8;background:#edf5fc;padding:10px;margin:8px 0;border-radius:4px}h2,h3{margin-top:0} .metric{font-size:30px;font-weight:bold} .warn{background:#fff3d5;padding:12px;border-radius:6px} .secondary{background:#52677b}</style></head><body><header><small style='color:#c8d9eb'>EST. 1976 • CELEBRATING 50 YEARS</small><h1>GRAHAM</h1>HEATING & AIR CONDITIONING · SERVICE MANAGER</header><nav id=nav></nav><main id=main></main><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>Number(n).toLocaleString('en-US',{style:'currency',currency:'USD'}),today=()=>new Date().toLocaleDateString('en-CA');let db={jobs:[],customers:[],estimates:[],tasks:[],techs:['Technician 1','Technician 2','Technician 3','Technician 4']};try{db=JSON.parse(localStorage.getItem('graham-v1'))||db}catch{}let page='Dashboard',date=today();function save(){localStorage.setItem('graham-v1',JSON.stringify(db))}function go(p){page=p;render()}const tabs=['Dashboard','Dispatch','Customers','Estimates','Reminders','Settings'];const field=(l,n,v='',type='text')=>`<label>${l}<input name="${n}" type="${type}" value="${esc(v)}"></label>`;const select=(l,n,opts,v)=>`<label>${l}<select name="${n}">${opts.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`;const statuses=['Scheduled','Dispatched','In progress','Waiting on parts','Completed'];function job(j){return `<div class=job><b>${esc(j.customer)}</b><p>${esc(j.type)} · ${esc(j.time)}</p><small>${esc(j.status)} · ${esc(j.address)}</small><p><button onclick="editJob('${j.id}')">Open job</button></p></div>`}function form(fn){$('#main form').onsubmit=e=>{e.preventDefault();fn(Object.fromEntries(new FormData(e.target)));save();render()}}function editJob(id){let j=db.jobs.find(x=>x.id===id)||{date,time:'08:00',status:'Scheduled',tech:db.techs[0]};$('#main').innerHTML=`<div class=panel><h2>Service call</h2><form>${field('Customer','customer',j.customer)}${field('Phone','phone',j.phone,'tel')}${field('Address','address',j.address)}${field('Work requested','type',j.type)}${field('Date','date',j.date,'date')}${field('Time','time',j.time,'time')}${select('Technician','tech',db.techs,j.tech)}${select('Status','status',statuses,j.status)}<label>Notes<textarea name=notes>${esc(j.notes)}</textarea></label><button>Save job</button> <button type=button class=secondary onclick="go('Dispatch')">Cancel</button></form></div>`;form(d=>{if(!d.customer.trim()||!d.type.trim()||!d.date||!d.time){alert('Customer, work, date and time are required');return}let record={...d,id:j.id||crypto.randomUUID()};db.jobs=db.jobs.filter(x=>x.id!==record.id).concat(record);if(!db.customers.some(c=>c.name===d.customer&&c.phone===d.phone))db.customers.push({name:d.customer,phone:d.phone,address:d.address,id:crypto.randomUUID()});page='Dispatch'})}function render(){$('#nav').innerHTML=tabs.map(t=>`<button onclick="go('${t}')">${t}</button>`).join('');let m=$('#main');if(page==='Dashboard')m.innerHTML=`<h2>Business overview</h2><div class=grid>${[['Open jobs',db.jobs.filter(j=>j.status!=='Completed').length],['Completed',db.jobs.filter(j=>j.status==='Completed').length],['Customers',db.customers.length],['Estimates',money(db.estimates.reduce((a,e)=>a+e.total,0))]].map(([l,v])=>`<div class=panel>${l}<div class=metric>${v}</div></div>`).join('')}</div><button onclick="editJob('')">+ Book service call</button><p class=warn>Local pilot: records are stored in this browser only. Do not enter sensitive customer data until production security is configured.</p>`;if(page==='Dispatch')m.innerHTML=`<h2>Dispatch board</h2><input type=date value="${esc(date)}" onchange="date=this.value;render()"><button onclick="editJob('')">+ Book job</button><p></p><div class=grid>${db.techs.map(t=>`<div class=panel><h3>${esc(t)}</h3>${db.jobs.filter(j=>j.tech===t&&j.date===date).sort((a,b)=>a.time.localeCompare(b.time)).map(job).join('')||'No jobs scheduled'}</div>`).join('')}</div>`;if(page==='Customers')m.innerHTML=`<h2>Customers</h2>${db.customers.map(c=>`<div class=panel><b>${esc(c.name)}</b><p>${esc(c.phone)} · ${esc(c.address)}</p>${db.jobs.filter(j=>j.customer===c.name&&j.phone===c.phone).map(job).join('')}</div>`).join('')||'Book a job to add a customer.'}`;if(page==='Estimates'){m.innerHTML=`<h2>Estimate builder</h2><div class=panel><form>${field('Customer','customer')}${field('Labor hours','hours',1,'number')}${field('Hourly rate','rate',135,'number')}${field('Parts cost','parts',0,'number')}${field('Markup %','markup',40,'number')}${field('Service call','fee',70,'number')}<h3 id=total></h3><button>Save estimate</button></form></div>${db.estimates.map(e=>`<div class=panel>${esc(e.customer)} — ${money(e.total)}</div>`).join('')}`;let calc=()=>{let d=Object.fromEntries(new FormData(m.querySelector('form')));return {...d,total:+d.hours*+d.rate+ +d.parts*(1+ +d.markup/100)+ +d.fee}};m.querySelectorAll('input[type=number]').forEach(i=>{i.min=0;i.step='0.01'});m.querySelector('form').oninput=()=>$('#total').textContent=money(calc().total)+' before tax';m.querySelector('form').oninput();form(()=>{let d=calc();if(d.customer.trim())db.estimates.push(d)})}if(page==='Reminders'){m.innerHTML=`<h2>Reminders</h2><p class=warn>Apple Reminders: native integration source included separately; not connected in browser.</p><form class=panel>${field('Task','title')}${field('Due date','due','','date')}${select('List','list',['Shared office',...db.techs],'Shared office')}<button>Add reminder</button></form>${db.tasks.map((t,i)=>`<div class=panel><input style="width:auto" type=checkbox ${t.done?'checked':''} onchange="db.tasks[${i}].done=this.checked;save();render()"> ${esc(t.title)} · ${esc(t.list)} · ${esc(t.due)}</div>`).join('')}`;form(d=>{if(d.title.trim())db.tasks.push({...d,done:false})})}if(page==='Settings'){m.innerHTML=`<h2>Settings</h2><form class=panel>${db.techs.map((t,i)=>field('Technician '+(i+1),'t'+i,t)).join('')}<button>Save names</button></form><div class=panel>QuickBooks: not connected<br>PayAnywhere: not connected<br>Apple Reminders: requires native iOS app</div><button onclick="exportData()">Export local backup</button>`;form(d=>{let names=db.techs.map((t,i)=>d['t'+i].trim()||t);if(new Set(names).size!==4)return alert('Use unique names');db.jobs.forEach(j=>{let i=db.techs.indexOf(j.tech);if(i>=0)j.tech=names[i]});db.tasks.forEach(j=>{let i=db.techs.indexOf(j.list);if(i>=0)j.list=names[i]});db.techs=names})}}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='graham-backup.json';a.click();URL.revokeObjectURL(a.href)}render();</script></body></html>
