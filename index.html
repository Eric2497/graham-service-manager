<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graham Service Manager</title><style> *{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#eef2f6;color:#173047}header{background:#102c48;color:white;padding:22px}h1{margin:0;letter-spacing:2px}nav{display:flex;flex-wrap:wrap;background:white;padding:8px;gap:6px}button{background:#17629b;color:white;border:0;border-radius:6px;padding:10px;cursor:pointer;font:inherit}button:disabled{opacity:.5}main{padding:18px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.panel{background:white;border:1px solid #d8e1eb;border-radius:9px;padding:16px;margin-bottom:12px}input,select,textarea{width:100%;padding:10px;border:1px solid #bac8d5;border-radius:5px;font:inherit;margin:5px 0 12px}label{display:block}small{color:#60758a}.job{border-left:4px solid #297cb8;background:#edf5fc;padding:10px;margin:8px 0;border-radius:4px}h2,h3{margin-top:0}.metric{font-size:30px;font-weight:bold}#msg{padding:0 18px;color:#a12626;white-space:pre-wrap}.secondary{background:#52677b}
