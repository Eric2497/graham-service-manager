<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Graham Service Manager</title><style> *{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#eef2f6;color:#173047}header{background:#102c48;color:white;padding:22px}h1{margin:0;letter-spacing:2px}nav{display:flex;flex-wrap:wrap;background:white;padding:8px;gap:6px}button{background:#17629b;color:white;border:0;border-radius:6px;padding:10px;cursor:pointer;font:inherit}button:disabled{opacity:.5}main{padding:18px;max-width:1400px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.panel{background:white;border:1px solid #d8e1eb;border-radius:9px;padding:16px;margin-bottom:12px}input,select,textarea{width:100%;padding:10px;border:1px solid #bac8d5;border-radius:5px;font:inherit;margin:5px 0 12px}label{display:block}small{color:#60758a}.job{border-left:4px solid #297cb8;background:#edf5fc;padding:10px;margin:8px 0;border-radius:4px}h2,h3{margin-top:0}.metric{font-size:30px;font-weight:bold}#msg{padding:0 18px;color:#a12626;white-space:pre-wrap}.secondary{background:#52677b}
body{background:#f3f6fa}header{padding:18px 24px;border-bottom:4px solid #e8a33a}header h1{font-size:26px}nav{background:#142e49;padding:12px;gap:8px}nav button{background:transparent;text-align:left}nav button.active{background:#286395}main{max-width:none;padding:24px}.panel{box-shadow:0 2px 8px #18304a0b;border-radius:12px}.metric{font-size:36px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar input{width:auto;margin:0}.board{overflow:auto}.calendar{display:grid;gap:8px;min-width:850px}.lane{background:white;border:1px solid #d8e1eb;border-radius:8px;padding:10px;min-height:110px}.job{cursor:pointer}.job[data-status="Completed"]{border-color:#21945c;background:#e6f5ec}.job[data-status="In progress"]{border-color:#e3a12d;background:#fff4da}.job[data-status="Waiting on parts"]{border-color:#a56abf;background:#f4eafb}.job[data-status="Dispatched"]{border-color:#258e90;background:#e3f5f5}.job p{margin:6px 0}.job button{padding:6px;font-size:12px}.muted{color:#64748b;font-size:13px}.version{float:right;font-size:12px;color:#c8d9eb} @media(min-width:900px){body.signed nav{position:fixed;top:100px;bottom:0;width:210px;display:flex;flex-direction:column;flex-wrap:nowrap}body.signed main,body.signed #msg{margin-left:210px}body.signed header{height:100px}}@media(max-width:600px){main{padding:12px}nav{overflow:auto;flex-wrap:nowrap}nav button{white-space:nowrap}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{font-size:26px}}
</style><header><small style="color:#c8d9eb">EST. 1976 • CELEBRATING 50 YEARS</small><span class="version">V0.4 · CLOUD</span><h1>GRAHAM</h1>HEATING & AIR CONDITIONING · SERVICE MANAGER</header><nav id="nav"></nav><p id="msg" role="alert"></p><main id="main">Loading…</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const $=s=>document.querySelector(s), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>Number(n).toLocaleString('en-US',{style:'currency',currency:'USD'}), today=()=>new Date().toLocaleDateString('en-CA');
const api=supabase.createClient('https://yfgfekgmrcwjrcmzyaqn.supabase.co','sb_publishable_VhI-bCVxE8CeayG8AAUNyA_jxQ2mpLh');let role=null,user=null,db={},page='Dashboard',date=today(),busy=false;const tabs=['Dashboard','Dispatch','Customers','Estimates','Invoices','Reminders','Pricebook','Settings'], statuses=['Scheduled','Traveling','Arrived','Working','Waiting','Completed'];
function fail(e){$('#msg').textContent=e.message||String(e)}async function query(q){let r=await q;if(r.error)throw r.error;return r.data}const rpc=(n,p={})=>query(api.rpc(n,p));const owner=()=>role==='owner',staff=()=>role!=='technician';async function load(){let tables=['employees','customers','jobs','reminders','equipment'];if(owner())tables.push('company_settings','pricebook');let data=await Promise.all(tables.map(t=>query(api.from(t).select('*'))));db=Object.fromEntries(tables.map((t,i)=>[t,data[i]]));if(!owner()){db.pricebook=await rpc('get_selling_pricebook');db.company_settings=await rpc('get_selling_rates')}db.estimates=await rpc('get_staff_estimates');db.invoices=await rpc('get_staff_invoices');}function clear(){document.body.classList.remove('signed');db={};user=null;$('#nav').innerHTML='';}function login(){clear();$('#main').innerHTML='<div class="panel" style="max-width:420px;margin:auto"><h2>Employee sign in</h2><form><label>Username or email<input name="email" type="text" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button>Sign in</button></form></div>';bind(async d=>{await query(api.auth.signInWithPassword({...d,email:d.email.trim().includes('@')?d.email.trim():d.email.trim().toLowerCase()+'@graham.invalid'}));await start()})}async function start(){try{let s=await query(api.auth.getSession());if(!s.session)return login();user=s.session.user;role=await rpc('employee_role');if(!['owner','office','technician'].includes(role)){await api.auth.signOut();throw Error('Account not active')}page='Dashboard';await load();render()}catch(e){clear();login();fail(e)}}
function bind(fn){let f=$('#main form');f.onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;let b=f.querySelector('button');b.disabled=true;$('#msg').textContent='';try{await fn(Object.fromEntries(new FormData(f)))}catch(e){fail(e)}finally{busy=false;b.disabled=false}}}async function go(p){$('#msg').textContent='';try{await load();page=p;render()}catch(e){fail(e)}}async function logout(){await api.auth.signOut();login()}
const field=(l,n,v='',t='text',req=false)=>`<label>${l}<input name="${n}" type="${t}" value="${E(v)}" ${req?'required':''} ${t==='number'?'min="0" step="0.01"':''}></label>`;const opts=(l,n,a,v)=>`<label>${l}<select name="${n}">${a.map(([k,s])=>`<option value="${E(k)}" ${k===v?'selected':''}>${E(s)}</option>`).join('')}</select></label>`;const techs=()=>db.employees.filter(x=>x.role==='technician'&&x.active);const cust=id=>db.customers.find(c=>c.id===id)?.name||'Unknown customer';const job=j=>`<div class="job" data-status="${E(j.status)}" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${j.id}')"><b>${E(cust(j.customer_id))}</b><p>${E(j.title)} · ${E(j.scheduled_time)}</p><small>${E(j.status)} · ${E(j.service_address)}</small><p><button onclick="editJob('${j.id}')">Open job</button></p></div>`;
function editJob(id){if(!staff())return techJob(id);let j=db.jobs.find(x=>x.id===id)||{scheduled_date:date,scheduled_time:'08:00',status:'Scheduled'};$('#main').innerHTML=`<div class="panel"><h2>Service call</h2><form>${opts('Existing customer','customer_id',[['','New customer'],...db.customers.map(c=>[c.id,c.name])],j.customer_id||'')}${field('New customer name (if needed)','name')}${field('New customer phone','phone','','tel')}${field('Service address','service_address',j.service_address)}${field('Service fee','service_fee',j.service_fee??db.company_settings[0]?.service_fee??70,'number',true)}${field('Work requested','title',j.title,'text',true)}${field('Date','scheduled_date',j.scheduled_date,'date',true)}${field('Time','scheduled_time',j.scheduled_time,'time',true)}${opts('Technician','technician_id',[['','Unassigned'],...techs().map(t=>[t.id,t.full_name])],j.technician_id||'')}${opts('Status','status',statuses.map(s=>[s,s]),j.status)}<label>Notes<textarea name="diagnostic_notes">${E(j.diagnostic_notes)}</textarea></label><button>Save job</button> <button type="button" class="secondary" onclick="go('Dispatch')">Cancel</button></form></div>`;bind(async d=>{let {name,phone,...r}=d;if(!r.customer_id){if(!name.trim())throw Error('Enter a customer name or select an existing customer.');let c=await query(api.from('customers').insert({name,phone,address:r.service_address}).select().single());r.customer_id=c.id}r.technician_id=r.technician_id||null;r.completed_at=r.status==='Completed'?(j.completed_at||new Date().toISOString()):null;await query(id?api.from('jobs').update(r).eq('id',id):api.from('jobs').insert(r));await go('Dispatch')})}
function render(){if(!user)return login();document.body.classList.add('signed');$('#nav').innerHTML=tabs.filter(t=>staff()||t!=='Dispatch').map(t=>`<button class="${page===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('')+'<button class="secondary" onclick="logout()">Sign out</button>';let m=$('#main');if(page==='Dashboard')m.innerHTML=`<h2>${E(db.employees.find(e=>e.id===user.id)?.full_name||role)} · ${staff()?'Dashboard':'My service calls'}</h2><div class="grid">${[['Open jobs',db.jobs.filter(j=>j.status!=='Completed').length],['Completed',db.jobs.filter(j=>j.status==='Completed').length],['Customers',db.customers.length],...(owner()?[['Recorded invoice payments',money(db.invoices.reduce((a,i)=>a+Number(i.amount_paid),0))]]:[])].map(([l,v])=>`<div class="panel">${l}<div class="metric">${v}</div></div>`).join('')}</div>${staff()?'<button onclick="editJob(\'\')">+ Book service call</button>':''}<h3>Service calls</h3>${db.jobs.map(job).join('')||'No jobs'}<p>Cloud pilot · sample data only until permission testing is complete.</p>`;
if(page==='Dispatch'){let days=Array.from({length:weekly?7:1},(_,i)=>shift(date,i));let lanes=[{id:null,full_name:'Unassigned'},...techs(),...Array.from({length:Math.max(0,4-techs().length)},(_,i)=>({id:'pending'+i,full_name:'Technician '+(techs().length+i+1)+' · not configured'}))];m.innerHTML=`<h2>Dispatch board</h2><div class="toolbar"><button onclick="date=shift(date,weekly?-7:-1);render()">‹</button><input type="date" value="${E(date)}" onchange="date=this.value;render()"><button onclick="date=shift(date,weekly?7:1);render()">›</button><button onclick="weekly=!weekly;render()">${weekly?'Daily view':'Weekly view'}</button><button onclick="editJob('')">+ Book job</button><button class="secondary" onclick="go('Dispatch')">Refresh</button></div><p class="muted">Drag jobs between configured lanes on desktop, or open a job to change its date and technician on mobile.</p><div class="board"><div class="calendar" style="grid-template-columns:180px repeat(${days.length},minmax(170px,1fr))"><b>Technician</b>${days.map(d=>`<b>${E(d)}</b>`).join('')}${lanes.map(t=>`<div class="lane"><b>${E(t.full_name)}</b></div>${days.map(d=>`<div class="lane" ${String(t.id).startsWith('pending')?'':`ondragover="event.preventDefault()" ondrop="moveJob(event,'${t.id||''}','${d}')"`}>${db.jobs.filter(j=>j.technician_id===t.id&&j.scheduled_date===d).sort((a,b)=>(a.scheduled_time||'').localeCompare(b.scheduled_time||'')).map(job).join('')||'<small>No jobs</small>'}</div>`).join('')}`).join('')}</div></div>`;}
if(page==='Customers'){m.innerHTML=`<h2>Customer directory</h2><div class="toolbar"><input placeholder="Search name, phone or address" oninput="filterCustomers(this.value)">${staff()?`<button onclick="customerForm('')">+ Customer</button>`:''}</div><div id="customerList"></div>`;filterCustomers('')}
if(page==='Pricebook'){m.innerHTML=`<h2>Flat-rate pricebook</h2>${owner()?'<button onclick="priceForm()">+ Add item</button>':''}<p></p>${db.pricebook.map(p=>`<div class="panel"><b>${E(p.name)}</b> · ${E(p.category)}<p>${money(p.selling_price)}</p></div>`).join('')||'No items yet.'}`;}
if(page==='Estimates')estimatePage(m);
if(page==='Invoices')invoicePage(m);
if(page==='Reminders'){m.innerHTML=`<h2>Reminders</h2><p>Cloud reminders only. Apple Reminders is not connected.</p><form class="panel">${field('Task','title','','text',true)}${field('Due date','due_date','','date')}${opts('List','assigned_to',[['','Shared office'],...(staff()?db.employees:db.employees.filter(t=>t.id===user.id)).filter(t=>t.active).map(t=>[t.id,t.full_name])],'')}<button>Add reminder</button></form>${db.reminders.map(t=>`<div class="panel"><input style="width:auto" type="checkbox" ${t.completed?'checked':''} onchange="toggleTask('${t.id}',this.checked)"> ${E(t.title)} · ${E(t.due_date?.slice(0,10))}</div>`).join('')}`;bind(async d=>{await query(api.from('reminders').insert({...d,due_date:d.due_date?new Date(d.due_date+'T12:00:00').toISOString():null,assigned_to:d.assigned_to||null,shared:!d.assigned_to,created_by:user.id}));await go('Reminders')})}
if(page==='Settings')m.innerHTML=`<h2>Settings</h2><div class="panel">Signed in: ${E(user.email)}<p>Role: ${E(role)}</p>${owner()?db.employees.map(e=>`<p>${E(e.full_name)} · ${E(e.role)} · ${e.active?'Active':'Inactive'}</p>`).join(''): ''}<p>QuickBooks, PayAnywhere and Apple Reminders: not connected.</p></div>`;}
let weekly=false;
function shift(d,n){let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('en-CA')}
async function moveJob(e,t,d){e.preventDefault();if(!staff())return;let id=e.dataTransfer.getData('text/plain');if(!db.jobs.some(j=>j.id===id))return;try{await query(api.from('jobs').update({technician_id:t||null,scheduled_date:d}).eq('id',id));await go('Dispatch')}catch(e){fail(e)}}
function filterCustomers(q){$('#customerList').innerHTML=db.customers.filter(c=>[c.name,c.phone,c.address].join(' ').toLowerCase().includes(q.toLowerCase())).map(c=>`<div class="panel"><b>${E(c.name)}</b><p>${E(c.phone)} · ${E(c.address)}</p>${staff()?`<button onclick="customerForm('${c.id}')">Edit customer</button> <button onclick="equipmentForm('${c.id}')">+ Equipment</button>`:''}<h4>Equipment</h4>${db.equipment.filter(x=>x.customer_id===c.id).map(x=>`<p>${E(x.equipment_type)} · ${E(x.manufacturer)} · ${E(x.model_number)} · ${E(x.serial_number)}</p>`).join('')||'<small>No equipment</small>'}<h4>Service history</h4>${db.jobs.filter(j=>j.customer_id===c.id).map(job).join('')}</div>`).join('')||'No matching customers.'}
function customerForm(id){let c=db.customers.find(x=>x.id===id)||{};$('#main').innerHTML=`<h2>Customer details</h2><form class="panel">${field('Name','name',c.name,'text',true)}${field('Phone','phone',c.phone)}${field('Email','email',c.email,'email')}${field('Address','address',c.address)}${field('City','city',c.city)}${field('State','state',c.state)}${field('ZIP','zip',c.zip)}<button>Save customer</button> <button type="button" onclick="go('Customers')">Cancel</button></form>`;bind(async d=>{await query(id?api.from('customers').update(d).eq('id',id):api.from('customers').insert(d));await go('Customers')})}
function equipmentForm(id){$('#main').innerHTML=`<h2>Add equipment</h2><form class="panel">${field('Equipment type','equipment_type','','text',true)}${field('Manufacturer','manufacturer')}${field('Model','model_number')}${field('Serial','serial_number')}${field('Installation date','installation_date','','date')}${field('Warranty expiration','warranty_expiration','','date')}<button>Save equipment</button> <button type="button" onclick="go('Customers')">Cancel</button></form>`;bind(async d=>{await query(api.from('equipment').insert({...d,customer_id:id,installation_date:d.installation_date||null,warranty_expiration:d.warranty_expiration||null}));await go('Customers')})}
function priceForm(){let s=db.company_settings[0]||{};$('#main').innerHTML=`<h2>Add pricebook item</h2><form class="panel">${field('Item name','name','','text',true)}${field('Category','category')}${field('Parts cost','parts_cost',0,'number',true)}${field('Labor hours','labor_hours',1,'number',true)}<h3 id="total"></h3><button>Save item</button> <button type="button" onclick="go('Pricebook')">Cancel</button></form>`;let f=$('#main form'),calc=d=>Math.round((+d.parts_cost*(1+Number(s.parts_markup??40)/100)+ +d.labor_hours*Number(s.labor_rate??135))*100)/100;f.oninput=()=>$('#total').textContent=money(calc(Object.fromEntries(new FormData(f))))+' before service fee and tax';f.oninput();bind(async d=>{await query(api.from('pricebook').insert({...d,selling_price:calc(d)}));await go('Pricebook')})}
async function toggleTask(id,completed){try{await rpc('complete_reminder',{p_reminder_id:id,p_completed:completed});await go('Reminders')}catch(e){fail(e);render()}}
function techJob(id){let j=db.jobs.find(x=>x.id===id);if(!j)return;$('#main').innerHTML=`<div class="panel"><h2>${E(j.title)}</h2><p>${E(cust(j.customer_id))} · ${E(j.service_address)}</p><form>${opts('Status','status',statuses.map(s=>[s,s]),j.status)}<label>Diagnostic notes<textarea name="notes">${E(j.diagnostic_notes)}</textarea></label><button>Save status</button></form><button onclick="go('Estimates')">Create estimate</button></div>`;bind(async d=>{await rpc('update_my_job',{p_job_id:id,p_status:d.status,p_notes:d.notes});await go('Dashboard')})}
function estimatePage(m){let rate=db.company_settings[0]?.labor_rate??135; m.innerHTML=`<h2>Estimates</h2><form class="panel">${opts('Service call','job_id',[['','Select job'],...db.jobs.map(j=>[j.id,cust(j.customer_id)+' · '+j.title])],'')}${field('Description','description')}${field('Labor hours','labor_hours',1,'number',true)}<p>Labor rate: ${money(rate)}/hr</p>${field('Service fee','service_fee',db.company_settings[0]?.service_fee??70,'number',true)}<h3>Pricebook items</h3>${db.pricebook.filter(p=>p.active!==false).map(p=>field(E(p.name)+' · '+money(p.selling_price),'qty_'+p.id,0,'number')).join('')||'<p>No pricebook items yet.</p>'}<h3 id="total"></h3><button>Save estimate</button></form>${db.estimates.map(e=>`<div class="panel"><b>${E(e.customer_name||cust(e.customer_id))}</b><p>${E(e.description)} · ${money(e.total)} · ${E(e.status)}</p>${e.job_id&&e.status!=='Invoiced'?`<button onclick="invoiceForm('${e.id}')">Create invoice</button>`:''}</div>`).join('')}`;let f=m.querySelector('form');let items=d=>db.pricebook.filter(p=>Number(d['qty_'+p.id])>0).map(p=>({id:p.id,quantity:Number(d['qty_'+p.id])}));f.job_id.onchange=()=>{f.service_fee.value=db.jobs.find(j=>j.id===f.job_id.value)?.service_fee??70;f.oninput()};f.oninput=()=>{let d=Object.fromEntries(new FormData(f));$('#total').textContent=money(Number(d.service_fee)+Number(d.labor_hours)*Number(rate)+items(d).reduce((a,i)=>a+Math.round(i.quantity*Number(db.pricebook.find(p=>p.id===i.id).selling_price)*100)/100,0))+' before tax'};f.oninput();bind(async d=>{if(!d.job_id)throw Error('Select a service call');await rpc('create_job_estimate',{p_job_id:d.job_id,p_description:d.description,p_labor_hours:Number(d.labor_hours),p_service_fee:Number(d.service_fee),p_items:items(d)});await go('Estimates')})}
function invoiceForm(id){let e=db.estimates.find(x=>x.id===id);if(!e)return;$('#main').innerHTML=`<h2>Create invoice</h2><form class="panel"><p>Subtotal ${money(e.total)}</p>${field('Sales tax amount (verify applicable tax)','tax','','number',true)}<button>Confirm invoice</button></form>`;bind(async d=>{await rpc('create_job_invoice',{p_estimate_id:id,p_tax:Number(d.tax)});await go('Invoices')})}
function invoicePage(m){m.innerHTML=`<h2>Invoices</h2>${db.invoices.map(i=>`<div class="panel"><b>#${E(i.invoice_number)} · ${E(i.customer_name)}</b><p>Total ${money(i.total)} · Paid ${money(i.amount_paid)} · Balance ${money(i.balance_due)}</p><p>${E(i.status)}</p>${Number(i.balance_due)>0?`<button onclick="paymentForm('${i.id}')">Record payment</button>`:''}</div>`).join('')||'No invoices yet.'}`}
function paymentForm(id){let i=db.invoices.find(x=>x.id===id);if(!i)return;$('#main').innerHTML=`<h2>Record payment already received</h2><form class="panel"><p>Balance ${money(i.balance_due)}</p>${field('Amount','amount',i.balance_due,'number',true)}${opts('Method','method',['Cash','Check','Credit Card','Debit Card','Financing','Other'].map(x=>[x,x]),'Cash')}${field('Receipt reference (never card numbers)','reference')}<p>This does not charge a card.</p><button>Record payment</button></form>`;bind(async d=>{await rpc('record_payment',{p_invoice_id:id,p_amount:Number(d.amount),p_method:d.method,p_reference:d.reference||null});await go('Invoices')})}
start();
</script></html>
